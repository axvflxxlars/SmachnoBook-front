<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Особистий кабінет користувача SmachnoBook.">
    <title>SmachnoBook — мій кабінет</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="logo" href="index.html">SmachnoBook</a>
        <nav id="nav" class="nav">
        </nav>
      </div>
    </header>
    <main class="container">
      <p id="status" class="status">Завантаження...</p>
      <!-- Вміст показується лише після перевірки токена на сервері -->
      <div id="content" hidden>
        <h1>Мій кабінет</h1>
        <section class="card">
          <h2>Профіль</h2>
          <dl class="profile">
            <dt>Ім'я</dt>
            <dd id="profile-name">
            </dd>
            <dt>Логін</dt>
            <dd id="profile-username">
            </dd>
            <dt>Email</dt>
            <dd id="profile-email">
            </dd>
            <dt>Роль</dt>
            <dd id="profile-role">
            </dd>
          </dl>
        </section>
        <section class="card">
          <h2>Додати рецепт</h2>
          <form id="recipe-form" class="form" novalidate>
            <label>
              Назва
              <input name="title" maxlength="200" required>
            </label>
            <p class="field-error" data-for="title"></p>
            <label>
              Короткий опис
              <input name="description">
            </label>
            <p class="field-error" data-for="description"></p>
            <label>
              Приготування
              <textarea name="instructions" rows="4" required></textarea>
            </label>
            <p class="field-error" data-for="instructions"></p>
            <div class="row">
              <label>
                Час, хв
                <input name="cooking_time" type="number" min="1" required>
              </label>
              <label>
                Порцій
                <input name="servings" type="number" min="1" value="1">
              </label>
              <label>
                Складність
                <select name="difficulty">
                  <option value="easy">Легко</option>
                  <option value="medium">Середньо</option>
                  <option value="hard">Складно</option>
                </select>
              </label>
            </div>
            <p class="field-error" data-for="cooking_time"></p>
            <p class="field-error" data-for="servings"></p>
            <label>
              Категорія
              <select id="category-select" name="category_id"></select>
            </label>
            <p class="field-error" data-for="category_id"></p>
            <fieldset class="ingredients">
              <legend>Інгредієнти</legend>
              <div id="ingredient-rows"></div>
              <button id="add-ingredient" class="secondary" type="button">+ Ще інгредієнт</button>
            </fieldset>
            <p class="field-error" data-for="ingredients"></p>
            <p id="recipe-message" class="status"></p>
            <button type="submit">Зберегти рецепт</button>
          </form>
        </section>
        <section class="card">
          <h2>Мої рецепти</h2>
          <p id="my-status" class="status"></p>
          <ul id="my-recipes" class="recipes">
          </ul>
        </section>
        <!-- Секція лише для адміністратора (is_staff) -->
        <section id="admin-section" class="card" hidden>
          <h2>Адміністрування: нова категорія</h2>
          <form id="category-form" class="form inline" novalidate>
            <input name="name" maxlength="100" placeholder="Наприклад, Десерти" required>
            <button type="submit">Додати категорію</button>
          </form>
          <p class="field-error" data-for="name" id="category-error"></p>
          <p id="category-message" class="status"></p>
        </section>
      </div>
    </main>
    <script src="auth.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
