<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Реєстрація нового користувача SmachnoBook.">
    <title>SmachnoBook — реєстрація</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="logo" href="index.html">SmachnoBook</a>
        <nav id="nav" class="nav">
        </nav>
      </div>
    </header>
    <main class="container narrow">
      <h1>Реєстрація</h1>
      <form id="register-form" class="form" novalidate>
        <label>
          Ім'я користувача *
          <input name="username" autocomplete="username" maxlength="150" required>
        </label>
        <p class="field-error" data-for="username"></p>
        <label>
          Ім'я
          <input name="first_name" autocomplete="given-name" maxlength="150">
        </label>
        <p class="field-error" data-for="first_name"></p>
        <label>
          Прізвище
          <input name="last_name" autocomplete="family-name" maxlength="150">
        </label>
        <p class="field-error" data-for="last_name"></p>
        <label>
          Email *
          <input name="email"
                 type="email"
                 autocomplete="email"
                 maxlength="254"
                 required>
        </label>
        <p class="field-error" data-for="email"></p>
        <label>
          Пароль * (щонайменше 8 символів)
          <input name="password"
                 type="password"
                 autocomplete="new-password"
                 maxlength="128"
                 required>
        </label>
        <p class="field-error" data-for="password"></p>
        <label>
          Повторіть пароль *
          <input name="password_confirm"
                 type="password"
                 autocomplete="new-password"
                 maxlength="128"
                 required>
        </label>
        <p class="field-error" data-for="password_confirm"></p>
        <p id="form-error" class="status error"></p>
        <button type="submit">Зареєструватися</button>
      </form>
      <p>Уже маєте акаунт? <a id="login-link" href="login.html">Увійти</a></p>
    </main>
    <script src="auth.js"></script>
    <script src="register.js"></script>
  </body>
</html>
